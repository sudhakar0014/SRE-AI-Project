name = "-ai-sre-copilot"
main = "src/index.js"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sre-copilot-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "INCIDENT_SESSIONS"
class_name = "IncidentSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IncidentSession"]

[[workflows]]
binding = "INCIDENT_WORKFLOW"
name = "sre-incident-investigation"
class_name = "IncidentInvestigationWorkflow"

[vars]
APP_NAME = "SRE Incident Copilot"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MAX_INPUT_CHARS = "12000"
